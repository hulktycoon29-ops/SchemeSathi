services:
  # 1. Java REST API Backend (Docker Web Service)
  - type: web
    name: schemesathi-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true

  # 2. React Vite Frontend (Static Site)
  - type: web
    name: schemesathi-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
